name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - sync.py
      - template.html
      - tests/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B -m unittest discover -s tests -v
