name: Sync and publish Worlds 2026 calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sync.py
      - template.html
      - assets/**
      - static/**
      - tests/**
      - .github/workflows/publish.yml
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worlds-2026-calendar
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Download LoL Esports schedule and build calendar
        run: python sync.py
        env:
          LOL_ESPORTS_API_KEY: ${{ secrets.LOL_ESPORTS_API_KEY }}
          WORLDS_LEAGUE_ID: ${{ vars.WORLDS_LEAGUE_ID }}
      - name: Persist event identifiers between updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Worlds 2026 schedule snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
